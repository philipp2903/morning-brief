name: Morning Brief

on:
  schedule:
    # 03:00 UTC, Monday to Saturday.
    # Berlin is UTC+2 in summer and UTC+1 in winter, and GitHub can delay
    # scheduled runs under load, so this is deliberately early.
    - cron: "0 3 * * 1-6"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Email the result to Kindle (turn off to just inspect the build)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-and-send:
    # Runs on philipp's own Mac (residential IP) rather than GitHub's cloud
    # runners: NYT's bot-detection (DataDome) blocks the
    # well-known datacenter IP ranges GitHub-hosted runners use, independent
    # of login/subscription status. See the "morning-brief" label - this
    # workflow only targets that specific self-hosted runner, not any
    # self-hosted runner that might be added to the account later.
    runs-on: [self-hosted, morning-brief]
    # Every article now goes through a real Chrome navigation + Readability
    # extraction (not just NYT/Economist), so this needs more headroom
    # than the old Calibre-only pipeline.
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the local Calibre install
        run: |
          echo "/Applications/calibre.app/Contents/MacOS" >> "$GITHUB_PATH"
          "/Applications/calibre.app/Contents/MacOS/ebook-convert" --version

      - name: Compute build version
        run: |
          echo "BUILD_VERSION=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)-run${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Check Chrome CDP fetcher
        run: |
          if ! curl -sf --max-time 5 http://localhost:9333/json/version > /dev/null; then
            echo "::warning::Chrome CDP not reachable on :9333 - falls back to Calibre's own (blocked for NYT/Economist, less reliable extraction for everything else) fetcher today. See com.morningbrief.chrome.plist."
            exit 0
          fi
          # Reachable isn't enough: fetch_via_chrome.py can only attach to
          # an *existing* browser context, since creating a new one fails
          # outright on a real (non-Playwright-launched) Chrome profile -
          # confirmed directly, "Protocol error (Browser.setDownloadBehavior):
          # Browser context management is not supported", which silently
          # took down every single article fetch in one build (the CDP
          # instance was reachable the whole time, just with zero tabs open,
          # e.g. after the persistent Chrome window got relaunched). Catch
          # that specific state here instead of only finding out 190 failed
          # fetches into the log.
          TAB_COUNT=$(curl -sf --max-time 5 http://localhost:9333/json/list | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "unknown")
          if [ "$TAB_COUNT" = "0" ]; then
            echo "::warning::Chrome CDP is reachable on :9333 but has zero open tabs - every article fetch will fail today (a new browser context can't be created over CDP on a real Chrome profile). Open at least one tab in the persistent Chrome window and re-run."
          else
            echo "Chrome CDP reachable on :9333 with $TAB_COUNT open tab(s) - all sources will use it for fetching + extraction."
          fi

      - name: Build the brief
        id: build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          SENT_URLS_FILE: ${{ github.workspace }}/state/sent.json
          RECIPE_VERSION: ${{ env.BUILD_VERSION }}
          CHROME_FETCH_PYTHON: ${{ vars.CHROME_FETCH_PYTHON }}
          CHROME_FETCH_SCRIPT: ${{ github.workspace }}/scripts/fetch_via_chrome.py
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          mkdir -p state
          if ebook-convert recipes/morning_brief.recipe morning-brief.epub \
              --output-profile kindle_pw3 \
              --verbose \
              2>&1 | tee build.log; then
            ls -lh morning-brief.epub
            echo "built=true" >> "$GITHUB_OUTPUT"
          elif grep -q "No articles found, aborting" build.log; then
            # Every candidate failed the quality gate (bot-blocked, paywalled,
            # or otherwise unreadable) - a quiet day, not a broken pipeline.
            echo "No readable articles survived today; nothing to send."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Upload epub and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-brief-${{ env.BUILD_VERSION }}
          path: |
            morning-brief.epub
            build.log
          retention-days: 14
          if-no-files-found: warn

      - name: Send to Kindle
        if: steps.build.outputs.built == 'true' && (github.event_name != 'workflow_dispatch' || inputs.send_email)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
        run: |
          calibre-smtp \
            --relay "$SMTP_HOST" \
            --port "$SMTP_PORT" \
            --username "$SMTP_USER" \
            --password "$SMTP_PASS" \
            --encryption-method TLS \
            --attachment morning-brief.epub \
            --subject "Morning Brief $(date +%Y-%m-%d) ($BUILD_VERSION)" \
            "$MAIL_FROM" "$KINDLE_EMAIL" "Today's brief is attached."

      - name: Record what was delivered
        if: success() && steps.build.outputs.built == 'true' && (github.event_name != 'workflow_dispatch' || inputs.send_email)
        run: |
          if [ ! -f state/sent.json ]; then
            echo "No history file was produced, nothing to record."
            exit 0
          fi
          git config user.name "morning-brief"
          git config user.email "actions@users.noreply.github.com"
          git add state/sent.json
          git diff --quiet --cached && exit 0
          git commit -m "chore: articles delivered $(date +%F)"
          git push
