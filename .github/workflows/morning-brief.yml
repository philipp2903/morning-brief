name: Morning Brief

on:
  schedule:
    # 03:00 UTC, Monday to Saturday.
    # Berlin is UTC+2 in summer and UTC+1 in winter, and GitHub can delay
    # scheduled runs under load, so this is deliberately early.
    - cron: "0 3 * * 1-6"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Email the result to Kindle (turn off to just inspect the build)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libglx0 libfontconfig1 xdg-utils

      - name: Install Calibre
        run: |
          sudo -v
          wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh \
            | sudo sh /dev/stdin
          ebook-convert --version

      - name: Compute build version
        run: |
          echo "BUILD_VERSION=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)-run${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build the brief
        id: build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          SENT_URLS_FILE: ${{ github.workspace }}/state/sent.json
          RECIPE_VERSION: ${{ env.BUILD_VERSION }}
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          mkdir -p state
          if ebook-convert recipes/morning_brief.recipe morning-brief.epub \
              --output-profile kindle_pw3 \
              --verbose \
              2>&1 | tee build.log; then
            ls -lh morning-brief.epub
            echo "built=true" >> "$GITHUB_OUTPUT"
          elif grep -q "No articles found, aborting" build.log; then
            # Every candidate failed the quality gate (bot-blocked, paywalled,
            # or otherwise unreadable) - a quiet day, not a broken pipeline.
            echo "No readable articles survived today; nothing to send."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Upload epub and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-brief-${{ env.BUILD_VERSION }}
          path: |
            morning-brief.epub
            build.log
          retention-days: 14

      - name: Send to Kindle
        if: steps.build.outputs.built == 'true' && (github.event_name != 'workflow_dispatch' || inputs.send_email)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
        run: |
          calibre-smtp \
            --relay "$SMTP_HOST" \
            --port "$SMTP_PORT" \
            --username "$SMTP_USER" \
            --password "$SMTP_PASS" \
            --encryption-method TLS \
            --attachment morning-brief.epub \
            --subject "Morning Brief $(date +%Y-%m-%d) ($BUILD_VERSION)" \
            "$MAIL_FROM" "$KINDLE_EMAIL" "Today's brief is attached."

      - name: Record what was delivered
        if: success() && steps.build.outputs.built == 'true' && (github.event_name != 'workflow_dispatch' || inputs.send_email)
        run: |
          if [ ! -f state/sent.json ]; then
            echo "No history file was produced, nothing to record."
            exit 0
          fi
          git config user.name "morning-brief"
          git config user.email "actions@users.noreply.github.com"
          git add state/sent.json
          git diff --quiet --cached && exit 0
          git commit -m "chore: articles delivered $(date +%F)"
          git push
